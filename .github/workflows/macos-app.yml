name: macOS-App bauen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: App bauen
        run: |
          npm ci
          npm run app
      - name: Signatur prüfen und App verpacken
        env:
          APP: 'Mermaid Editor'
        run: |
          codesign --verify --strict "$APP.app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP.app" "artifacts/$APP.zip"
          (cd artifacts && shasum -a 256 "$APP.zip" > "$APP.zip.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: Mermaid-Editor-macOS
          path: artifacts/
          if-no-files-found: error
