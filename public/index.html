<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <title>Mermaid Editor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button id="btn-sidebar" class="icon" title="Dateien">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 3.5h12M2 8h12M2 12.5h12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="file-info">
      <span id="file-name">Unbenannt</span>
      <span id="dirty-dot" title="Ungespeicherte Änderungen"></span>
      <span id="file-dir"></span>
    </div>
    <span id="save-status"></span>

    <div class="center">
      <div class="seg" id="view-switch" role="tablist">
        <button data-view="code" title="Nur Code (Ctrl+1)">Code</button>
        <button data-view="split" title="Code und Diagramm (Ctrl+2)">Beides</button>
        <button data-view="preview" title="Nur Diagramm (Ctrl+3)">Diagramm</button>
      </div>
    </div>

    <div class="zoom" title="Zoom (auch ⌘+Scrollen / Pinch)">
      <button id="zoom-out" class="icon">−</button>
      <button id="zoom-val" title="Auf 100 % zurücksetzen">100%</button>
      <button id="zoom-in" class="icon">+</button>
    </div>
    <button id="btn-open" title="Datei öffnen (⌘O)">Öffnen</button>
    <button id="btn-save" class="primary" title="Speichern (⌘S)">Speichern</button>
    <div class="menu-wrap">
      <button id="btn-menu" class="icon" title="Mehr">
        <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <button data-act="new">Neues Dokument</button>
        <button data-act="open">Öffnen … <kbd>⌘O</kbd></button>
        <button data-act="folder">Ordner öffnen …</button>
        <button data-act="saveas">Speichern unter … <kbd>⇧⌘S</kbd></button>
        <button data-act="reveal">Im Finder zeigen</button>
        <hr>
        <button data-act="autosave" class="check">Automatisch speichern</button>
        <button data-act="wrap" class="check">Zeilen umbrechen</button>
        <hr>
        <div class="menu-label">Darstellung</div>
        <button data-theme-opt="auto" class="check">System</button>
        <button data-theme-opt="light" class="check">Hell</button>
        <button data-theme-opt="dark" class="check">Dunkel</button>
      </div>
    </div>
  </header>

  <div id="conflict" class="banner" hidden>
    <span>Die Datei wurde ausserhalb des Editors geändert.</span>
    <button data-act="reload">Version von der Festplatte laden</button>
    <button data-act="keep" class="primary">Meine Version speichern</button>
  </div>
  <div id="offline" class="banner">Verbindung zum Editor-Server getrennt – Änderungen werden nicht gespeichert. Starte den Mermaid Editor neu.</div>

  <main id="workspace" class="view-split">
    <aside id="sidebar">
      <div class="side-head">
        <span id="root-name">–</span>
        <button id="btn-refresh" class="icon small" title="Aktualisieren">↻</button>
        <button id="btn-folder" class="icon small" title="Ordner wechseln …">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 4.5v8h13v-6.5h-6.5l-1.5-1.5z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <input id="file-filter" type="search" placeholder="Filtern …" spellcheck="false">
      <div id="file-list"></div>
    </aside>
    <div id="panes">
      <section id="editor-pane"><div id="editor"></div></section>
      <div id="divider" title="Ziehen zum Anpassen, Doppelklick = 50/50"></div>
      <section id="preview-pane"><article id="preview" class="markdown-body"></article></section>
    </div>
  </main>

  <div id="toast"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
