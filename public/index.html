<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="__TOKEN__">
  <title>Mermaid Editor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button id="btn-sidebar" class="icon" data-i18n-title="files">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 3.5h12M2 8h12M2 12.5h12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="file-info">
      <span id="file-name" data-i18n="untitled"></span>
      <span id="dirty-dot" data-i18n-title="unsavedChanges"></span>
      <span id="file-dir"></span>
    </div>
    <span id="save-status"></span>

    <div class="center">
      <div class="seg" id="view-switch" role="group" data-i18n-label="viewLabel">
        <button data-view="code" data-i18n-title="codeTitle" data-i18n="code"></button>
        <button data-view="split" data-i18n-title="splitTitle" data-i18n="split"></button>
        <button data-view="preview" data-i18n-title="diagramTitle" data-i18n="diagram"></button>
      </div>
    </div>

    <div class="zoom" data-i18n-title="zoom">
      <button id="zoom-out" class="icon" data-i18n-title="zoomOut">−</button>
      <button id="zoom-val" data-i18n-title="zoomReset">100%</button>
      <button id="zoom-in" class="icon" data-i18n-title="zoomIn">+</button>
    </div>
    <button id="btn-open" data-i18n-title="openTitle" data-i18n="open"></button>
    <button id="btn-save" class="primary" data-i18n-title="saveTitle" data-i18n="save"></button>
    <div class="menu-wrap">
      <button id="btn-menu" class="icon" aria-controls="menu" aria-expanded="false" data-i18n-title="more">
        <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <button data-act="new" data-i18n="newDoc"></button>
        <button data-act="newMermaid" data-i18n="newMermaid"></button>
        <button data-act="open"><span data-i18n="openMenu"></span> <kbd>⌘O</kbd></button>
        <button data-act="folder" data-i18n="openFolder"></button>
        <button data-act="find" data-i18n="find"></button>
        <button data-act="saveas"><span data-i18n="saveAs"></span> <kbd>⇧⌘S</kbd></button>
        <button data-act="pdf" data-i18n="exportPdfMenu"></button>
        <button data-act="reveal" data-i18n="reveal"></button>
        <hr>
        <button data-act="autosave" class="check" data-i18n="autosave"></button>
        <button data-act="wrap" class="check" data-i18n="wrap"></button>
        <hr>
        <div class="menu-label" data-i18n="appearance"></div>
        <button data-theme-opt="auto" class="check" data-i18n="system"></button>
        <button data-theme-opt="light" class="check" data-i18n="light"></button>
        <button data-theme-opt="dark" class="check" data-i18n="dark"></button>
        <hr>
        <div class="menu-label" data-i18n="language"></div>
        <button data-locale="de" class="check" data-i18n="german"></button>
        <button data-locale="en" class="check" data-i18n="english"></button>
      </div>
    </div>
  </header>

  <div id="conflict" class="banner" hidden>
    <span data-i18n="conflictNotice"></span>
    <button data-act="reload" data-i18n="reload"></button>
    <button data-act="keep" class="primary" data-i18n="keep"></button>
  </div>
  <div id="offline" class="banner" data-i18n="offline"></div>

  <main id="workspace" class="view-split">
    <aside id="sidebar">
      <div class="side-head">
        <span id="root-name">–</span>
        <button id="btn-refresh" class="icon small" data-i18n-title="refresh">↻</button>
        <button id="btn-folder" class="icon small" data-i18n-title="changeFolder">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 4.5v8h13v-6.5h-6.5l-1.5-1.5z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <input id="file-filter" type="search" data-i18n-placeholder="filter" spellcheck="false">
      <div id="file-list"></div>
    </aside>
    <div id="panes">
      <section id="editor-pane"><div id="editor"></div></section>
      <div id="divider" data-i18n-title="divider"></div>
      <section id="preview-pane"><article id="preview" class="markdown-body"></article></section>
    </div>
  </main>

  <dialog id="discard-dialog" aria-labelledby="discard-question">
    <form method="dialog">
      <p id="discard-question" data-i18n="discard"></p>
      <div class="dialog-actions">
        <button value="cancel" data-i18n="cancel" autofocus></button>
        <button value="discard" class="primary" data-i18n="discardButton"></button>
      </div>
    </form>
  </dialog>
  <dialog id="pdf-dialog" aria-labelledby="pdf-title">
    <form method="dialog">
      <h2 id="pdf-title" data-i18n="exportPdf"></h2>
      <label class="pdf-option">
        <input type="checkbox" id="pdf-toc">
        <span data-i18n="pdfIncludeToc"></span>
      </label>
      <label class="pdf-option">
        <input type="checkbox" id="pdf-show-breaks">
        <span data-i18n="pdfPageBreaks"></span>
      </label>
      <div id="pdf-preview" hidden>
        <div class="pdf-preview-tools">
          <span data-i18n="pdfBreakHelp"></span>
          <button id="pdf-reset-breaks" type="button" data-i18n="pdfResetBreaks" disabled></button>
        </div>
        <div id="pdf-pages" tabindex="0" data-i18n-label="pdfPageBreaks"></div>
      </div>
      <p id="pdf-browser-help" data-i18n="pdfBrowserHelp"></p>
      <p id="pdf-progress" role="status" hidden data-i18n="pdfPreparing"></p>
      <div class="dialog-actions">
        <button type="button" value="cancel" data-i18n="cancel"></button>
        <button id="pdf-export" value="export" class="primary" data-i18n="pdfContinue"></button>
      </div>
    </form>
  </dialog>
  <div id="pdf-document"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
